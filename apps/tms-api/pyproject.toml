[project]
name = "zolexora-tms-api"
version = "0.1.0"
description = "Zolexora TMS Production API Service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.32",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.2",
    "dramatiq[redis]>=1.17.0",
    "redis>=5.0.8",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "boto3>=1.35.0",
    "aioboto3>=13.1.0",
    "cloudinary>=1.41.0",
    "resend>=2.1.0",
    "sentry-sdk[fastapi]>=2.13.0",
    "python-multipart>=0.0.9",
    "reportlab>=5.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "black>=24.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["app"]
