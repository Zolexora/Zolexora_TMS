services:
  - type: web
    name: zolexora-erp-api
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: D1_ACCESS_MODE
        value: gateway
      - key: D1_GATEWAY_URL
        sync: false
      - key: D1_GATEWAY_TOKEN
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
