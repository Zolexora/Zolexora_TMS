name = "zolexora-d1-gateway"
main = "src/index.ts"
compatibility_date = "2026-06-01"

# Create with: wrangler d1 create zolexora-transactional
# Then paste the resulting database_id below.
[[d1_databases]]
binding = "DB"
database_name = "zolexora-transactional"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

# Set with: wrangler secret put GATEWAY_TOKEN
# Generate a long random value, e.g. `openssl rand -hex 32`, and put the
# SAME value in the FastAPI backend's D1_GATEWAY_TOKEN env var on Render.
