version: '3.8'

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  backend:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env.docker
    environment:
      - ENVIRONMENT=development
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  tms:
    build:
      context: ..
      dockerfile: Dockerfile
      target: tms
    ports:
      - "3000:80"
    restart: unless-stopped

  admin:
    build:
      context: ..
      dockerfile: Dockerfile
      target: admin
    ports:
      - "3001:80"
    restart: unless-stopped

volumes:
  redis_data:
